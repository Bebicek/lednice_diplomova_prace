services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lednicka-app
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/html/.env
      - storage-data:/var/www/html/storage/app
      - public-data:/var/www/html/public
    environment:
      - APP_ENV=production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/public/index.php"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - lednicka

  nginx:
    image: nginx:alpine
    container_name: lednicka-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public-data:/var/www/html/public:ro
      - storage-data:/var/www/html/storage/app:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - lednicka

  db:
    image: postgres:16-alpine
    container_name: lednicka-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lednicka}
      POSTGRES_USER: ${DB_USERNAME:-lednicka}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lednicka}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lednicka

  certbot:
    image: certbot/certbot:latest
    container_name: lednice_certbot
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  postgres-data:
  storage-data:
  public-data:

networks:
  lednicka:
    driver: bridge
