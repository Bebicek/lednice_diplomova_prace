# HTTP server — ACME challenge + redirect na HTTPS
server {
    listen 80;
    server_name gajdaj.cz www.gajdaj.cz;

    # ACME challenge for renew Let's Encrypt certificate
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # everything else relocate to https
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name gajdaj.cz www.gajdaj.cz;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/gajdaj.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gajdaj.cz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Max upload size (for commodity images etc.)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire routes must go through PHP, not served as static files
    location ~* ^/livewire {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Serve static assets directly
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pass PHP requests to php-fpm
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Block access to dotfiles (except ACME challenge)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
